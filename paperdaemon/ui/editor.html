<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page editor</title>
<style>
/* The page editor, in the False Mirror's viewer (tablet.js opens it in a frame: #doc=<id>&page=<n>&base=/fm). It loads
   the page from the false mirror's engine and saves it back as it changes (remarkable/local.py: scene_of, write_scene),
   only when what it would write differs from what it last wrote. Made from docs/design/mockups/editor-v3.html
   (openspec/changes/add-page-editor). THE PAGE IS .rm DATA, DRAWN BY PaperDaemon'S OWN RENDERER
   (fastdecomp/render.c and render.py, ported line for line). What the tablet showed us, and this page follows:
   * fixed units: strokes, text sizes, spacing and the three text columns are the same on every frame;
   * the drawable square, as wide as the page is tall, centered: ink and text past it are kept and not shown;
   * typed text is one centered column (wide 1152, medium 936, narrow 740) from y 234, in four styles; lists are body text;
   * two pen pickers; the one in hand opens its menu: nine pens, three sizes (none for the highlighter), and the pen's
     colors (nine; the highlighter six; the shader eight);
   * the eraser takes whole strokes, or what it passes over; text and ink are separate layers.
   The tablet's faces are used when the false mirror is set in them (an account signed in, its faces taken from the
   desktop app, never in the repository); otherwise PaperDaemon's own: Arimo and Gelasio, openly licensed and cut to
   the widths of Arial and Georgia, the closest measured, shipped with PaperDaemon and served by the engine. */
:root {
  --paper: #242124; --paper-sunk: #1C1A1C; --field: #2E2A2F; --ink: #BDB6AA; --ink-2: #9A9389; --ink-3: #6F6970;
  --rule: #3A353C; --edge: #6C6670; --mark: #D0806A; --shade: rgba(0, 0, 0, 0.5);
  --font-ui: "Times New Roman", Times, serif;
}
html, body { margin: 0; height: 100%; background: var(--paper-sunk); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
/* the page's own selection is drawn on the canvas: nothing of the editor's chrome is ever selected, so a drag over the
   page can never pick up a selection and turn into the browser's drag (the crossed-out cursor) */
body { user-select: none; -webkit-user-select: none; }
img, a, svg, canvas { -webkit-user-drag: none; }
.dialog { position: absolute; inset: 0; background: var(--paper-sunk); display: flex; flex-direction: column; }
.note { padding: 4px 22px 0; font-size: 13px; color: var(--ink-3); }
.note:empty { display: none; }
.bar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 22px;
  border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--ink-2); }
.controls { display: flex; gap: 4px; align-items: center; }
.sep { width: 1px; height: 22px; background: var(--rule); margin: 0 6px; }
/* EVEN SIZES, so an icon centers on whole pixels at every zoom: a 36 x 36 button, a 24 x 24 icon */
.ib { position: relative; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; background: transparent;
  border: 0; border-radius: 3px; color: var(--ink); cursor: pointer; box-sizing: border-box; }
.ib:hover { background: var(--field); }
.ib[aria-pressed="true"] { background: var(--ink); color: var(--paper-sunk); }      /* the tool in hand, inverted */
.ib svg { width: 24px; height: 24px; display: block; }
.ib .dot { position: absolute; right: 1px; top: 1px; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; }
.dot.ring { border: 1.5px solid currentColor; }
.body { position: relative; flex: 1; display: grid; place-items: start center; padding: 16px; }
/* IN THE VIEWER (embedded): the tools are in the viewer's bar, so this bar goes; a menu opens at the top of the frame,
   right under the button pressed there, and the saved state sits at its top right */
.embedded .bar { display: none; }
.embedded .body { padding: 0; }
.embedded .pop { top: 2px; }
.embedded #saved { display: none; }
.viewport { position: relative; overflow: hidden; touch-action: none; cursor: crosshair; }
/* UNTIL THE PAGE HAS LOADED a spinner covers it, and takes every press: nothing is drawn, typed or pasted onto a page
   that is not there yet */
.loading { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(30, 33, 32, 0.35); cursor: progress; }
.loading[hidden] { display: none; }
.loading i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.25); border-top-color: #D0806A;
  animation: pd-spin 0.9s linear infinite; }
@keyframes pd-spin { to { transform: rotate(360deg); } }
.viewport.typing { cursor: text; }
.viewport.typing.docsel:not([data-erase]) { cursor: default; }
.viewport.typing.docsel.ibeam:not([data-erase]) { cursor: text; }
.viewport.linkhand { cursor: pointer !important; }
canvas { display: block; }
/* where the view is, down the page: a thin bar at the page's right edge, its thumb dragged to scroll */
.vscroll { position: absolute; right: 2px; top: 3px; bottom: 3px; width: 12px; z-index: 3; opacity: 0;
           transition: opacity 0.45s ease; }                 /* out slowly, once the page is still */
/* the middle button's autoscroll: its mark where it was pressed, a dot with the ways the page can go */
.automark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 4; pointer-events: none; }
.vscroll.on, .vscroll:hover, .vscroll.drag { opacity: 1; transition-duration: 0.12s; }
.pd-links { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.pd-link { position: absolute; pointer-events: auto; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 2px; }
.pd-link:hover, .pd-link:focus-visible { background: rgba(255, 213, 0, 0.18); outline: 1px solid rgba(160, 120, 0, 0.45); }
.vscroll i { position: absolute; right: 3px; width: 5px; border-radius: 3px; background: rgba(0, 0, 0, 0.30);
             box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55); transition: width 0.12s ease, right 0.12s ease, background 0.12s ease; }
.vscroll:hover i, .vscroll.drag i { right: 2px; width: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.46); }
.zoom { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 4px 12px; border-radius: 14px;
  background: rgba(30, 28, 30, 0.85); color: #F2EEE6; font: 15px var(--font-ui); border: 0; cursor: pointer;
  opacity: 0; transition: opacity 300ms; pointer-events: none; }
.zoom.on { opacity: 1; pointer-events: auto; }
/* a tool's menu, laid out as the tablet's: a title, then sections of 3-wide grids, each choice an icon or a dot over its name */
.pop { position: absolute; z-index: 5; top: calc(100% - 4px); width: 228px; background: var(--paper); border: 1px solid var(--edge);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); }
.pop[hidden] { display: none; }
.sec { padding: 12px 12px 10px; }
.sec + .sec { border-top: 1px solid var(--rule); }
.sec h3 { margin: 0 0 8px 4px; font: 600 15px var(--font-ui); color: var(--ink); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.cell { height: 64px; display: grid; place-items: center; align-content: center; gap: 4px; background: transparent; border: 0;
  color: var(--ink); cursor: pointer; font: 14px var(--font-ui); padding: 0; }
.cell.short { height: 52px; }
.cell:hover { background: var(--field); }
.cell[aria-pressed="true"] { background: var(--ink); color: var(--paper-sunk); }
.cell svg { width: 26px; height: 26px; display: block; }
.sw { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; }
.sw.ring { border: 1.5px solid currentColor; }
.sw.split { overflow: hidden; display: grid; grid-template-rows: 1fr 1fr; }
.sw.split i { display: block; }
.pop.wide { width: 300px; }
.pop.narrow { width: 158px; }                       /* two choices: Select and Capture */
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
.lsec + .lsec { border-top: 1px solid var(--rule); }
.lrow { display: flex; align-items: center; height: 48px; padding: 0 8px; gap: 2px; color: var(--ink); }
.lrow.on { background: var(--ink); color: var(--paper-sunk); }
.lb { width: 36px; height: 36px; flex: none; display: grid; place-items: center; background: transparent; border: 0; color: inherit; cursor: pointer; padding: 0; }
.lb svg { width: 22px; height: 22px; }
.lb.sm svg { width: 18px; height: 18px; }
.lb.off { opacity: 0.35; cursor: default; }
.lname { flex: 1; height: 100%; display: flex; align-items: center; padding: 0 10px; background: transparent; border: 0; color: inherit; font: 15px var(--font-ui); text-align: left; cursor: pointer; }
span.lname { cursor: default; }
.lnew { width: 100%; border: 0; background: transparent; cursor: pointer; font: 15px var(--font-ui); gap: 10px; padding: 0 14px; }
.lnew:hover, .lname:hover { background: var(--field); }
.lrow.on .lname:hover { background: transparent; }
.lnew svg { width: 22px; height: 22px; }
/* the template picker: a screen over the editor, five across, each icon over its name, the page's own underlined */
.tpl-pick { position: fixed; inset: 0; z-index: 20; background: var(--paper-sunk); display: flex; flex-direction: column; }
.tpl-pick[hidden] { display: none; }
.tpl-head { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--rule); font-weight: 600; font-size: 16px; }
.tpl-back { width: 32px; height: 32px; border: 0; background: transparent; color: var(--ink); font-size: 22px; cursor: pointer; }
.tpl-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 16px 18px; align-content: start; }
.tpl { display: grid; justify-items: center; gap: 6px; padding: 10px 4px 8px; border: 0; background: transparent; color: var(--ink);
  font: 14px var(--font-ui); cursor: pointer; border-bottom: 3px solid transparent; }
.tpl:hover { background: var(--field); }
.tpl { position: relative; }
/* a template PaperDaemon draws itself (the app keeps no definition of it): a small warning, its words on hover */
.tpl-approx { position: absolute; top: 6px; right: 8px; width: 16px; height: 16px; color: #C9A227; display: grid; place-items: center; }
.tpl-approx svg { width: 16px; height: 16px; }
.tpl.here { border-bottom-color: var(--ink); }
.tpl .tpl-ico { display: block; width: 45px; height: 60px; fill: currentColor; }
.tpl .tpl-mask { background: currentColor; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
.cell.off { opacity: 0.35; cursor: default; }
.cell.off:hover { background: transparent; }
/* the right button's menu: what can be done where it was pressed */
.cmenu { position: fixed; z-index: 30; min-width: 220px; padding: 4px 0; background: var(--paper); border: 1px solid var(--edge);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); font: 14px var(--font-ui); }
.cmenu[hidden] { display: none; }
.cmenu button { display: flex; width: 100%; justify-content: space-between; gap: 24px; padding: 7px 14px; border: 0; background: transparent;
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.cmenu button:hover { background: var(--field); }
.cmenu button:disabled { opacity: 0.4; cursor: default; background: transparent; }
.cmenu kbd { font: inherit; color: var(--ink-3); }
.cmenu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="dialog" id="dlg">
  <div class="note" id="note"></div>
  <div class="bar" id="bar">
    <span class="controls" id="controls"></span>
    <span id="saved"></span>
    <div class="pop" id="pop" hidden></div>
  </div>
  <div class="body"><div class="viewport" id="vp"><canvas id="cv"></canvas><div class="loading" id="loading" role="status" aria-label="Loading the page"><i></i></div><button class="zoom" id="zoom" title="Back to 1x"></button><div class="vscroll" id="vscroll"><i></i></div></div></div>
</div>
<div class="cmenu" id="cmenu" role="menu" hidden></div>
<script src="shaders.js"></script>
<script src="filer.js"></script>
<script>
"use strict";
(() => {
  // ================================================================ THE PAGE: .rm data
  const COLUMNS = { narrow: [-370, 740], medium: [-468, 936], wide: [-576, 1152] };   // x, width: the same on every frame
  const page = {
    paperSize: [1620, 2160],
    layers: [{ nodeId: [0, 11], label: "Layer 1", visible: true, lines: [] }],
    text: { column: "wide", x: -576, y: 234, width: 1152, paras: [] },            // RootTextBlock: one block, one column
    images: [],                                                                    // pictures: {name, key, quad (4 corners)}
    textVisible: true, templateVisible: true, template: "Blank",                  // SceneInfo's root_document_visible and
                                                                                   // background_visible; the template is named in .content
    nextId: 1,                                                                         // PaperDaemon writes as author 2
  };
  let activeLayer = 0;                                         // the layer the pens and the eraser work on
  const layer = () => page.layers[activeLayer];
  // A STROKE'S POINTS, flat: six numbers a point -- x, y, speed, direction, width, pressure (the file's own fields) -- in
  // one array, never an object a point. A page of tens of thousands of strokes holds a million points: as objects, every
  // garbage collection walked them all (pauses of 15 to 25 ms, felt mid-stroke), and opening a page made them all. n: the
  // points; the array may have room past them (a stroke being drawn grows into it). No P[i]: a point is read by its fields
  class Pts {
    constructor(a, n) { this.a = a; this.n = n; }
    get length() { return this.n; }
    x(i) { return this.a[6 * i]; }
    y(i) { return this.a[6 * i + 1]; }
    speed(i) { return this.a[6 * i + 2]; }
    direction(i) { return this.a[6 * i + 3]; }
    width(i) { return this.a[6 * i + 4]; }
    pressure(i) { return this.a[6 * i + 5]; }
    at(i) {                                                     // point i as an object, where only a few are wanted
      const a = this.a, o = 6 * i;
      return { x: a[o], y: a[o + 1], speed: a[o + 2], direction: a[o + 3], width: a[o + 4], pressure: a[o + 5] };
    }
    push(x, y, speed, direction, width, pressure) {
      if (6 * (this.n + 1) > this.a.length) { const b = new Float64Array(Math.max(96, 2 * this.a.length)); b.set(this.a.subarray(0, 6 * this.n)); this.a = b; }
      const a = this.a, o = 6 * this.n++;
      a[o] = x; a[o + 1] = y; a[o + 2] = speed; a[o + 3] = direction; a[o + 4] = width; a[o + 5] = pressure;
    }
    add(p) { this.push(p.x, p.y, p.speed, p.direction, p.width, p.pressure); }      // a point given as an object
    copyFrom(P, i) { const b = P.a, o = 6 * i; this.push(b[o], b[o + 1], b[o + 2], b[o + 3], b[o + 4], b[o + 5]); }
    copyAt(P, i, x, y) { const b = P.a, o = 6 * i; this.push(x, y, b[o + 2], b[o + 3], b[o + 4], b[o + 5]); }   // (put at x, y)
    slice(i0, i1) { return new Pts(this.a.slice(6 * i0, 6 * i1), i1 - i0); }       // points i0 to before i1, copied
    copy() { return this.slice(0, this.n); }
    trim() { if (this.a.length > 6 * this.n) this.a = this.a.slice(0, 6 * this.n); }   // no room past its points
    moved(dx, dy) { const q = this.copy(), a = q.a; for (let o = 0; o < 6 * q.n; o += 6) { a[o] += dx; a[o + 1] += dy; } return q; }   // (a copy)
    toArrays() { const out = []; for (let i = 0; i < this.n; i++) out.push(Array.from(this.a.subarray(6 * i, 6 * i + 6))); return out; }
    static room(n) { return new Pts(new Float64Array(6 * Math.max(1, n)), 0); }
    static from(list) {                                         // points as lists [x, y, speed, direction, width, pressure],
      const n = list.length, a = new Float64Array(6 * n);       // or as objects {x, y, speed, direction, width, pressure}
      for (let i = 0, o = 0; i < n; i++, o += 6) {
        const p = list[i];
        if (Array.isArray(p)) { a[o] = p[0]; a[o + 1] = p[1]; a[o + 2] = p[2]; a[o + 3] = p[3]; a[o + 4] = p[4]; a[o + 5] = p[5]; }
        else { a[o] = p.x; a[o + 1] = p.y; a[o + 2] = p.speed; a[o + 3] = p.direction; a[o + 4] = p.width; a[o + 5] = p.pressure; }
      }
      return new Pts(a, n);
    }
  }
  window.pdPts = list => Pts.from(list);                      // (points made the way the page holds them, for a look from outside)
  // A THUMBNAIL (#...&thumb=W, the window's page pictures): the page drawn once, W wide, the top of it in a 3:4 card as
  // the tablet shows its thumbnails, by the same renderer, and handed to the window (drawThumb); nothing saved
  const THUMB_W = Number(new URLSearchParams(location.hash.slice(1)).get("thumb")) || 0;
  let thumbHold = !!THUMB_W;                                  // until everything under the ink is in: no drawing
  // THE MIRROR'S PAGES (#...&view=1): the same editor with its edit controls stripped -- no tools in the bar, nothing
  // drawn, erased, typed, pasted or dropped, nothing saved; scrolling, zooming and the page coming in as the tablet
  // changes it are as ever. One gate, ahead of every handler (the capture phase, on the window), lets through only what
  // looks; a page's links are followed (placeLinks), and the keys that turn pages go to the viewer
  const VIEW = /(^|[#&])view=1(&|$)/.test(location.hash);
  if (VIEW) {
    const TURN = ["ArrowLeft", "ArrowRight", "PageUp", "PageDown"];
    const LOOK = ["ArrowUp", "ArrowDown", "Home", "End", "Escape", "Tab"];
    window.addEventListener("keydown", e => {
      if (TURN.includes(e.key) && !e.ctrlKey && !e.metaKey) {
        e.preventDefault(); e.stopImmediatePropagation();
        if (window.parent !== window) window.parent.postMessage({ pd: "view-key", key: e.key, altKey: e.altKey }, location.origin);
        return;
      }
      const zoom = (e.ctrlKey || e.metaKey) && ["+", "-", "=", "0", "c", "w"].includes(e.key.toLowerCase());   // (w: the viewer's close)
      if (LOOK.includes(e.key) || zoom) return;
      e.stopImmediatePropagation();
      if (e.key.length === 1 || ["Delete", "Backspace", "Enter"].includes(e.key)) e.preventDefault();
    }, true);
    for (const t of ["paste", "cut", "drop", "beforeinput"]) window.addEventListener(t, e => { e.preventDefault(); e.stopImmediatePropagation(); }, true);
    window.addEventListener("pointerdown", e => {
      if (e.button === 1) return;                             // the middle button scrolls, as it does anywhere
      const el = e.target && e.target.closest ? e.target : null;
      if (!el || el.closest(".pd-link") || el.closest("#vscroll") || el.closest("#zoom")) return;
      if (el.closest("#vp")) { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
  }
  // A SWIPE LET GO THAT IS STILL CATCHING UP (eraseFlush) is finished at once before anything else reaches the page: a
  // key (a modifier alone may be the next swipe's), a press, a paste or a copy, a word from the viewer
  // On the card the swipe may need a frame or two more (its cuts read back): the event, and every one after it until then,
  // is held and sent again once it is settled, in order
  const heldEvents = [];
  const hold = e => { e.preventDefault(); e.stopImmediatePropagation(); heldEvents.push(e); };
  function release() { for (const e of heldEvents.splice(0)) (e.target || window).dispatchEvent(new e.constructor(e.type, e)); }
  for (const t of ["keydown", "pointerdown", "paste", "cut", "copy", "drop", "message"]) window.addEventListener(t, e => {
    if (heldEvents.length) { hold(e); return; }
    if ((t !== "keydown" || !["Shift", "Control", "Alt", "Meta"].includes(e.key)) && !settleSwipe()) { hold(e); swipeWaits.push(release); }
  }, true);
  for (const t of ["keyup", "pointermove", "pointerup", "pointercancel", "mousedown", "mouseup", "click", "dblclick", "contextmenu", "wheel"])
    window.addEventListener(t, e => { if (heldEvents.length) hold(e); }, true);
  // ALT+LEFT AND ALT+RIGHT, the page open to edit or to look at, walk the viewer's history of pages (as the mouse's back
  // and forward buttons do): never the browser's Back, which took the app behind the viewer a screen back
  // CTRL+W and CTRL+TAB (with Shift: back) are the viewer's: close the notebook, go to the next one
  window.addEventListener("keydown", e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || (e.key !== "w" && e.key !== "W" && e.key !== "Tab")) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (window.parent !== window) window.parent.postMessage({ pd: "viewer-key", key: e.key === "Tab" ? "Tab" : "w", shiftKey: e.shiftKey }, location.origin);
  }, true);
  window.addEventListener("keydown", e => {
    if (!e.altKey || e.ctrlKey || e.metaKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (window.parent !== window) window.parent.postMessage({ pd: "view-key", key: e.key, altKey: true }, location.origin);
  }, true);
  // THE MOUSE'S BACK AND FORWARD BUTTONS over the page walk the viewer's history, as Alt+Left and Alt+Right do: the
  // press and the release both taken here, or the app's window would go back a screen behind the viewer
  for (const t of ["pointerdown", "pointerup", "mousedown", "mouseup", "auxclick"]) window.addEventListener(t, e => {
    if (e.button !== 3 && e.button !== 4) return;
    e.preventDefault(); e.stopImmediatePropagation();
    // the walk on the release of the pointer: the press taken (preventDefault) holds back the mouse's own events
    if (t === "pointerup" && window.parent !== window) window.parent.postMessage({ pd: "view-key", key: e.button === 3 ? "ArrowLeft" : "ArrowRight", altKey: true }, location.origin);
  }, true);
  const SCREEN_W = 1620;                                                               // what the Paper Pro shows at 1x

  // ================================================================ PENS AND COLORS
  // The tablet's 3 x 3 order. STORED WIDTH per thickness scale (1 / 2 / 3): the fineliner's 8 and the highlighter's 120
  // are the tablet's own, the marker's read off the user's strokes, and the pencils' 12 and the shader's 44 (its full
  // width) off the user's strokes on the pen-test pages (2026-10-19); the ballpoint's, the calligraphy pen's and the
  // paintbrush's are still placeholders. How every pen is drawn is the renderer's.
  const PENS = [
    { id: "ballpoint", pen: "BALLPOINT_2", code: 15, name: "Ballpoint pen", per: 8 },
    { id: "fineliner", pen: "FINELINER_2", code: 17, name: "Fineliner", per: 8 },
    { id: "highlighter", pen: "HIGHLIGHTER_2", code: 18, name: "Highlighter", per: 120, sizes: false },
    { id: "pencil", pen: "PENCIL_2", code: 14, name: "Pencil", per: 12 },
    { id: "mechanical", pen: "MECHANICAL_PENCIL_2", code: 13, name: "Mechanical pencil", per: 12 },
    { id: "calligraphy", pen: "CALIGRAPHY", code: 21, name: "Calligraphy pen", per: 16 },
    { id: "marker", pen: "MARKER_2", code: 16, name: "Marker", per: 20 },
    { id: "shader", pen: "SHADER", code: 23, name: "Shader", per: 44 },
    { id: "brush", pen: "PAINTBRUSH_2", code: 12, name: "Paintbrush", per: 24 },
  ];
  const PEN = Object.fromEntries(PENS.map(p => [p.id, p]));
  const SIZES = ["Thin", "Medium", "Thick"];
  // render.py's tables: ENUM, the pens' ink (D3: the tablet's pens are pure colors; this stays until that is decided);
  // HL_ENUM, the highlighters' washes

      if (THUMB_W) { drawThumb(); return; }
      loadTemplate(); loadSource().then(loadLinks); largeCheck();
      loaded = true;
      savedAt = changes;                                      // as read: nothing to save until something changes
    } catch (e) {
      await gpuReady;                                         // (whatever happened, the card's answer first: nothing is drawn before it)
      if (THUMB_W) { window.parent.postMessage({ pd: "thumb-done", ok: false, why: e.message }, location.origin); return; }
      note.textContent = "This page could not be read: " + e.message;
    }
    paintControls(); layout();
    ready = true; document.getElementById("loading").hidden = true;   // loaded, or not to be (the editor opened from its file)
  }

  window.addEventListener("resize", layout);
  // ESC CLOSES WHAT IS OPEN FIRST: a menu of the viewer's around the page (its tags) before anything here
  let viewerMenu = false;
  window.addEventListener("keydown", e => {
    if (e.key !== "Escape" || !viewerMenu || !EMBED) return;
    e.preventDefault(); e.stopImmediatePropagation();
    viewerMenu = false; window.parent.postMessage({ pd: "viewer-menu-close" }, location.origin);
  }, true);
  if (EMBED) {
    document.body.classList.add("embedded");
    dlg.append(pop);                                         // out of the hidden bar: menus open at the frame's top
    dlg.append(saved);
    window.addEventListener("message", e => {
      const d = e.data;
      if (e.source !== window.parent || !d) return;
      if (d.pd === "editor-press") {
        popX = Number(d.x) || 0;
        const b = controls.querySelector('[data-tool="' + d.tool + '"]');
        if (b) b.click();
      } else if (d.pd === "editor-close" && popFor) { popFor = null; paintPop(); paintControls(); }
      else if (d.pd === "viewer-menu") viewerMenu = !!d.open;
      else if (d.pd === "editor-key") {                        // a key pressed in the viewer outside the page: as if here
        window.dispatchEvent(new KeyboardEvent("keydown", { key: d.key, code: d.code, ctrlKey: d.ctrlKey, shiftKey: d.shiftKey,
                                                            altKey: d.altKey, metaKey: d.metaKey, cancelable: true }));
      }
    });
  }
  paintControls(); layout(); findFaces(); loadPage(); checkTemplates();
  window.editorPage = page;                                  // the page's data, for a look from outside
  window.editorView = view;                                  // and where it is scrolled and zoomed to
  // ESC WITH NOTHING HERE TO LET GO (no menu, caret, selection, shape, corners, zone, template picker: each of those
  // takes its Esc first) CLOSES THE NOTEBOOK, as Esc in the viewer around the page does. Last of the page's listeners,
  // so it hears only an Esc no one else took
  window.addEventListener("keydown", e => {
    if (e.key !== "Escape" || e.defaultPrevented || !EMBED) return;
    const tp = document.getElementById("tpl-pick");
    if (tp && !tp.hidden) { e.preventDefault(); tp.hidden = true; return; }
    e.preventDefault();
    window.parent.postMessage({ pd: "viewer-key", key: "Escape" }, location.origin);
  });
})();
</script>
</body>
</html>
