[project]
name = "paperdaemon"
version = "0.1.56"
description = "A reMarkable assistant: it watches your tablet for tagged pages and answers them with the models you choose."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "keyring>=25",
    "pywebview>=5",
    "pillow>=12.3.0",
    # the pipeline (paperdaemon/pipeline). Exact pins where the decomposer's output must stay
    # bit-identical to its reference (numpy) and where the page format is read and written (rmscene).
    "numpy==2.5.3",
    "rmscene==0.8.0",
    "fonttools>=4.65.0",
    "jsonschema>=4.26.0",
    "pypdfium2>=5.13.0",
    "vl-convert-python>=1.9.0",
    "winrt-runtime>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",
    "httpx>=0.28.1",
    "holidays>=0.106",
    "pyside6-essentials==6.10.3",
]

[project.scripts]
paperdaemon = "paperdaemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperdaemon"]

[dependency-groups]
# The decomposer's Python reference runs on these; the app never loads them (it decomposes in C), and the
# build leaves them out. Exact pins, so the reference stays bit-identical to the C it is checked against.
reference = [
    "numba==0.67.0",
    "opencv-python-headless==5.0.0.93",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "shapely==2.1.2",
]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "ziglang==0.16.0",
]

[tool.uv]
default-groups = ["dev", "reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
