<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page editor v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Gelasio:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* The page editor, v3 (openspec/changes/add-page-editor). THE PAGE IS .rm DATA, DRAWN BY PaperDaemon'S OWN RENDERER
   (fastdecomp/render.c and render.py, ported line for line). What the tablet showed us, and this page follows:
   * fixed units: strokes, text sizes, spacing and the three text columns are the same on every frame;
   * the drawable square, as wide as the page is tall, centered: ink and text past it are kept and not shown;
   * typed text is one centered column (wide 1152, medium 936, narrow 740) from y 234, in four styles; lists are body text;
   * two pen pickers; the one in hand opens its menu: nine pens, three sizes (none for the highlighter), and the pen's
     colors (nine; the highlighter six; the shader eight);
   * the eraser takes whole strokes, or what it passes over; text and ink are separate layers.
   The tablet's faces are used when they are beside this file in rm-fonts/ (never in the repository); otherwise the
   substitute: Arimo and Gelasio, openly licensed and cut to the widths of Arial and Georgia, the closest measured. */
:root {
  --paper: #242124; --paper-sunk: #1C1A1C; --field: #2E2A2F; --ink: #BDB6AA; --ink-2: #9A9389; --ink-3: #6F6970;
  --rule: #3A353C; --edge: #6C6670; --mark: #D0806A; --shade: rgba(0, 0, 0, 0.5);
  --font-ui: "Times New Roman", Times, serif;
}
@font-face { font-family: "PD Tablet Sans"; src: url("rm-fonts/reMarkableSans-Regular.ttf"); font-weight: 400; font-style: normal; }
@font-face { font-family: "PD Tablet Sans"; src: url("rm-fonts/reMarkableSans-Bold.ttf"); font-weight: 700; font-style: normal; }
@font-face { font-family: "PD Tablet Sans"; src: url("rm-fonts/reMarkableSans-RegularItalic.ttf"); font-weight: 400; font-style: italic; }
@font-face { font-family: "PD Tablet Sans"; src: url("rm-fonts/reMarkableSans-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
@font-face { font-family: "PD Tablet Serif"; src: url("rm-fonts/reMarkableSerifSmall-Regular.ttf"); font-weight: 400; font-style: normal; }
@font-face { font-family: "PD Tablet Serif"; src: url("rm-fonts/reMarkableSerifSmall-Bold.ttf"); font-weight: 700; font-style: normal; }
@font-face { font-family: "PD Tablet Serif"; src: url("rm-fonts/reMarkableSerifSmall-RegularItalic.ttf"); font-weight: 400; font-style: italic; }
@font-face { font-family: "PD Tablet Serif"; src: url("rm-fonts/reMarkableSerifSmall-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
html, body { margin: 0; height: 100%; background: #141214; color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
.backdrop { position: fixed; inset: 0; background: var(--shade); }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper-sunk);
  border: 1px solid var(--edge); display: flex; flex-direction: column; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px 0; font-weight: 600; font-size: 17px; }
.note { padding: 4px 22px 0; font-size: 13px; color: var(--ink-3); }
.note:empty { display: none; }
.bar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 22px;
  border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--ink-2); }
.controls { display: flex; gap: 4px; align-items: center; }
.sep { width: 1px; height: 22px; background: var(--rule); margin: 0 6px; }
/* EVEN SIZES, so an icon centers on whole pixels at every zoom: a 36 x 36 button, a 24 x 24 icon */
.ib { position: relative; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; background: transparent;
  border: 0; border-radius: 3px; color: var(--ink); cursor: pointer; box-sizing: border-box; }
.ib:hover { background: var(--field); }
.ib[aria-pressed="true"] { background: var(--ink); color: var(--paper-sunk); }      /* the tool in hand, inverted */
.ib svg { width: 24px; height: 24px; display: block; }
.ib .dot { position: absolute; right: 1px; top: 1px; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; }
.dot.ring { border: 1.5px solid currentColor; }
.body { position: relative; flex: 1; display: grid; place-items: center; padding: 16px; }
.viewport { position: relative; overflow: hidden; touch-action: none; cursor: crosshair; }
.viewport.typing { cursor: text; }
canvas { display: block; }
.zoom { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 4px 12px; border-radius: 14px;
  background: rgba(30, 28, 30, 0.85); color: #F2EEE6; font: 15px var(--font-ui); border: 0; cursor: pointer;
  opacity: 0; transition: opacity 300ms; pointer-events: none; }
.zoom.on { opacity: 1; pointer-events: auto; }
/* a tool's menu, laid out as the tablet's: a title, then sections of 3-wide grids, each choice an icon or a dot over its name */
.pop { position: absolute; z-index: 5; top: calc(100% - 4px); width: 228px; background: var(--paper); border: 1px solid var(--edge);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); }
.pop[hidden] { display: none; }
.sec { padding: 12px 12px 10px; }
.sec + .sec { border-top: 1px solid var(--rule); }
.sec h3 { margin: 0 0 8px 4px; font: 600 15px var(--font-ui); color: var(--ink); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.cell { height: 64px; display: grid; place-items: center; align-content: center; gap: 4px; background: transparent; border: 0;
  color: var(--ink); cursor: pointer; font: 14px var(--font-ui); padding: 0; }
.cell.short { height: 52px; }
.cell:hover { background: var(--field); }
.cell[aria-pressed="true"] { background: var(--ink); color: var(--paper-sunk); }
.cell svg { width: 26px; height: 26px; display: block; }
.sw { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; }
.sw.ring { border: 1.5px solid currentColor; }
.sw.split { overflow: hidden; display: grid; grid-template-rows: 1fr 1fr; }
.sw.split i { display: block; }
.pop.wide { width: 300px; }
.lsec + .lsec { border-top: 1px solid var(--rule); }
.lrow { display: flex; align-items: center; height: 48px; padding: 0 8px; gap: 2px; color: var(--ink); }
.lrow.on { background: var(--ink); color: var(--paper-sunk); }
.lb { width: 36px; height: 36px; flex: none; display: grid; place-items: center; background: transparent; border: 0; color: inherit; cursor: pointer; padding: 0; }
.lb svg { width: 22px; height: 22px; }
.lb.sm svg { width: 18px; height: 18px; }
.lb.off { opacity: 0.35; cursor: default; }
.lname { flex: 1; height: 100%; display: flex; align-items: center; padding: 0 10px; background: transparent; border: 0; color: inherit; font: 15px var(--font-ui); text-align: left; cursor: pointer; }
span.lname { cursor: default; }
.lnew { width: 100%; border: 0; background: transparent; cursor: pointer; font: 15px var(--font-ui); gap: 10px; padding: 0 14px; }
.lnew:hover, .lname:hover { background: var(--field); }
.lrow.on .lname:hover { background: transparent; }
.lnew svg { width: 22px; height: 22px; }
.cell.off { opacity: 0.35; cursor: default; }
.cell.off:hover { background: transparent; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="dialog" id="dlg" role="dialog" aria-label="Blank page">
  <div class="head"><span>Blank page</span></div>
  <div class="note" id="note"></div>
  <div class="bar" id="bar">
    <span class="controls" id="controls"></span>
    <span>Page 1 of 1</span>
    <div class="pop" id="pop" hidden></div>
  </div>
  <div class="body"><div class="viewport" id="vp"><canvas id="cv"></canvas><button class="zoom" id="zoom" title="Back to 1x"></button></div></div>
</div>
<script>
"use strict";
(() => {
  // ================================================================ THE PAGE: .rm data
  const COLUMNS = { narrow: [-370, 740], medium: [-468, 936], wide: [-576, 1152] };   // x, width: the same on every frame
  const page = {
    paperSize: [1620, 2160],
    layers: [{ nodeId: [0, 11], label: "Layer 1", visible: true, lines: [] }],
    text: { column: "wide", x: -576, y: 234, width: 1152, paras: [] },            // RootTextBlock: one block, one column
    textVisible: true, templateVisible: true, template: "Blank",                  // SceneInfo's root_document_visible and
                                                                                   // background_visible; the template is named in .content
    nextId: 1,                                                                         // PaperDaemon writes as author 2
  };
  let activeLayer = 0;                                         // the layer the pens and the eraser work on
  const layer = () => page.layers[activeLayer];
  const SCREEN_W = 1620;                                                               // what the Paper Pro shows at 1x

  // ================================================================ PENS AND COLORS
  // The tablet's 3 x 3 order. STORED WIDTH at 50% pressure per thickness scale (1 / 2 / 3): the fineliner's 8 and the
  // highlighter's 120 are the tablet's own, the marker's read off the user's strokes; the rest are PLACEHOLDERS until
  // each pen's strokes are read from a synced page (tasks 2.3). How every pen is drawn is the renderer's.
  const PENS = [
    { id: "ballpoint", pen: "BALLPOINT_2", code: 15, name: "Ballpoint pen", per: 8 },
    { id: "fineliner", pen: "FINELINER_2", code: 17, name: "Fineliner", per: 8 },
    { id: "highlighter", pen: "HIGHLIGHTER_2", code: 18, name: "Highlighter", per: 120, sizes: false },
    { id: "pencil", pen: "PENCIL_2", code: 14, name: "Pencil", per: 12 },
    { id: "mechanical", pen: "MECHANICAL_PENCIL_2", code: 13, name: "Mechanical pencil", per: 6 },
    { id: "calligraphy", pen: "CALIGRAPHY", code: 21, name: "Calligraphy pen", per: 16 },
    { id: "marker", pen: "MARKER_2", code: 16, name: "Marker", per: 20 },
    { id: "shader", pen: "SHADER", code: 23, name: "Shader", per: 60 },
    { id: "brush", pen: "PAINTBRUSH_2", code: 12, name: "Paintbrush", per: 24 },
  ];
  const PEN = Object.fromEntries(PENS.map(p => [p.id, p]));
  const SIZES = ["Thin", "Medium", "Thick"];
  // render.py's tables: ENUM, the pens' ink (D3: the tablet's pens are pure colors; this stays until that is decided);
  // HL_ENUM, the highlighters' washes
  const ENUM = { 0: [0, 0, 0], 1: [144, 144, 144], 2: [255, 255, 255], 3: [254, 253, 96], 4: [169, 250, 92], 5: [255, 85, 207],
                 6: [48, 74, 224], 7: [194, 49, 50], 8: [191, 191, 191], 9: [255, 255, 255], 10: [145, 218, 113], 11: [116, 210, 232],
                 12: [192, 127, 210], 13: [250, 231, 25] };
  const HL_ENUM = { 3: [255, 237, 117], 13: [255, 237, 117], 4: [172, 255, 133], 10: [172, 255, 133], 5: [242, 158, 255],
                    12: [242, 158, 255], 6: [190, 234, 254], 11: [190, 234, 254], 1: [199, 199, 198], 8: [199, 199, 198] };
  // each pen's colors as its menu offers them: the stored color, the stored RGBA when the color is one, and the swatch the
  // tablet's menu shows (sampled from its screen share)
  const PEN_COLORS = [
    ["Black", 0, null, [0, 0, 0], true], ["Gray", 1, null, [148, 146, 148]], ["White", 2, null, [255, 255, 255], true],
    ["Blue", 6, null, [0, 0, 255]], ["Red", 7, null, [255, 0, 0]], ["Green", 4, null, [0, 255, 0]],
    ["Yellow", 3, null, [255, 255, 0]], ["Cyan", 11, null, [0, 255, 255]], ["Magenta", 12, null, [255, 0, 255]],
  ];
  const HL_COLORS = [                          // the orange's storage is unread (tasks 2.4): kept as color 9 with its RGBA
    ["Yellow", 3, null, HL_ENUM[3]], ["Blue", 6, null, HL_ENUM[6]], ["Pink", 5, null, HL_ENUM[5]],
    ["Orange", 9, [255, 195, 140, 255], [255, 195, 140]], ["Green", 4, null, HL_ENUM[4]], ["Gray", 1, null, HL_ENUM[1]],
  ];
  const SH_TOP = { Gray: [128, 128, 128], Orange: [255, 178, 0], Magenta: [198, 125, 214], Blue: [49, 73, 231], Red: [198, 48, 49],
                   Green: [148, 219, 115], Yellow: [255, 231, 24], Cyan: [115, 211, 239] };
  const SH_CODE = { Gray: 1, Orange: 9, Magenta: 12, Blue: 6, Red: 7, Green: 4, Yellow: 3, Cyan: 11 };
  const SH_COLORS = Object.keys(SH_TOP).map(n => [n, SH_CODE[n], SH_TOP[n].concat([96]), SH_TOP[n], false, true]);  // shader: the renderer's alpha
  const colorsOf = id => id === "highlighter" ? HL_COLORS : id === "shader" ? SH_COLORS : PEN_COLORS;
  const WSCALE = { HIGHLIGHTER: 0.25 }, WSCALE_DEFAULT = 0.144, PENCIL_FAMILY = ["PENCIL", "MECHANICAL"];

  const pickers = { a: { pen: "fineliner", size: 1, pick: 0 }, b: { pen: "highlighter", size: 0, pick: 0 } };
  let tool = "a", eraseMode = "stroke", popFor = null;
  const choiceOf = pk => { const cs = colorsOf(pk.pen); return cs[Math.min(pk.pick, cs.length - 1)]; };

  // ================================================================ THE RENDERER, ported from fastdecomp/render.c
  const RF_PEN = 0, RF_HIGHLIGHTER = 1, RF_SHADER = 2;
  const loPx = v => { const f = Math.floor(v - 0.5); return f < -1 ? -1 : f; };
  const hiPx = v => Math.ceil(v - 0.5);
  function put(c, x, y, kind, rgba, sid) {
    if (x < c.cx0 || x > c.cx1 || y < c.cy0 || y > c.cy1) return;          // the drawable square only: past it, kept and not shown
    const i = (y * c.W + x) * 3, p = c.px;
    if (kind === RF_PEN) { p[i] = rgba[0]; p[i + 1] = rgba[1]; p[i + 2] = rgba[2]; }
    else if (kind === RF_HIGHLIGHTER) {
      if (rgba[0] < p[i]) p[i] = rgba[0]; if (rgba[1] < p[i + 1]) p[i + 1] = rgba[1]; if (rgba[2] < p[i + 2]) p[i + 2] = rgba[2];
    } else {
      const s = y * c.W + x;
      if (c.stamp[s] === sid) return;
      c.stamp[s] = sid;
      const a = rgba[3] / 255;
      for (let k = 0; k < 3; k++) p[i + k] = Math.round(p[i + k] + (rgba[k] - p[i + k]) * a);
    }
  }
  function capsule(c, ax, ay, bx, by, r, kind, rgba, sid) {
    if (!(r > 0)) return;
    let x0 = loPx(Math.min(ax, bx) - r), x1 = hiPx(Math.max(ax, bx) + r);
    let y0 = loPx(Math.min(ay, by) - r), y1 = hiPx(Math.max(ay, by) + r);
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0; if (x1 > c.W - 1) x1 = c.W - 1; if (y1 > c.H - 1) y1 = c.H - 1;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, r2 = r * r;
    for (let y = y0; y <= y1; y++) {
      const py = y + 0.5;
      for (let x = x0; x <= x1; x++) {
        const px = x + 0.5;
        let t = 0;
        if (L2 > 0) { t = ((px - ax) * dx + (py - ay) * dy) / L2; t = t < 0 ? 0 : (t > 1 ? 1 : t); }
        const ex = px - (ax + t * dx), ey = py - (ay + t * dy);
        if (ex * ex + ey * ey <= r2) put(c, x, y, kind, rgba, sid);
      }
    }
  }
  function convex(c, qx, qy, kind, rgba, sid) {
    const n = qx.length;
    let mnx = qx[0], mxx = qx[0], mny = qy[0], mxy = qy[0], area = 0;
    for (let i = 0; i < n; i++) {
      mnx = Math.min(mnx, qx[i]); mxx = Math.max(mxx, qx[i]); mny = Math.min(mny, qy[i]); mxy = Math.max(mxy, qy[i]);
      const j = (i + 1) % n; area += qx[i] * qy[j] - qx[j] * qy[i];
    }
    if (Math.abs(area) < 1e-12) return;
    const sgn = area > 0 ? 1 : -1;
    let x0 = loPx(mnx), x1 = hiPx(mxx), y0 = loPx(mny), y1 = hiPx(mxy);
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0; if (x1 > c.W - 1) x1 = c.W - 1; if (y1 > c.H - 1) y1 = c.H - 1;
    for (let y = y0; y <= y1; y++) {
      const py = y + 0.5;
      for (let x = x0; x <= x1; x++) {
        const px = x + 0.5;
        let inside = true;
        for (let i = 0; i < n && inside; i++) {
          const j = (i + 1) % n;
          const e = sgn * ((qx[j] - qx[i]) * (py - qy[i]) - (qy[j] - qy[i]) * (px - qx[i]));
          if (e < 0) inside = false;
          else if (e === 0) { const ex = (qx[j] - qx[i]) * sgn, ey = (qy[j] - qy[i]) * sgn; if (!(ey > 0 || (ey === 0 && ex < 0))) inside = false; }
        }
        if (inside) put(c, x, y, kind, rgba, sid);
      }
    }
  }
  function penShape(c, xy, w, kind, rgba, sid) {
    const n = w.length;
    if (n === 1) { capsule(c, xy[0], xy[1], xy[0], xy[1], w[0] / 2, kind, rgba, sid); return; }
    for (let i = 0; i + 1 < n; i++) capsule(c, xy[2 * i], xy[2 * i + 1], xy[2 * i + 2], xy[2 * i + 3], (w[i] + w[i + 1]) / 4, kind, rgba, sid);
  }
  function highlighterShape(c, xy, w, rgba, sid) {
    const sx = [], sy = [], sw = [];
    for (let i = 0; i < w.length; i++) {
      const m = sx.length;
      if (m && Math.abs(xy[2 * i] - sx[m - 1]) <= 1e-6 && Math.abs(xy[2 * i + 1] - sy[m - 1]) <= 1e-6) continue;
      sx.push(xy[2 * i]); sy.push(xy[2 * i + 1]); sw.push(w[i]);
    }
    const m = sx.length;
    if (m < 2) return;
    const dx = [], dy = [], hw = [];
    for (let i = 0; i + 1 < m; i++) {
      const ex = sx[i + 1] - sx[i], ey = sy[i + 1] - sy[i], L = Math.sqrt(ex * ex + ey * ey);
      dx[i] = ex / L; dy[i] = ey / L; hw[i] = (sw[i] + sw[i + 1]) / 4;
    }
    for (let i = 0; i + 1 < m; i++) {
      const nx = -dy[i] * hw[i], ny = dx[i] * hw[i];
      convex(c, [sx[i] + nx, sx[i + 1] + nx, sx[i + 1] - nx, sx[i] - nx], [sy[i] + ny, sy[i + 1] + ny, sy[i + 1] - ny, sy[i] - ny], RF_HIGHLIGHTER, rgba, sid);
    }
    for (let i = 1; i + 1 < m; i++) {
      const cross = dx[i - 1] * dy[i] - dy[i - 1] * dx[i];
      if (Math.abs(cross) < 1e-6) continue;
      const s = cross > 0 ? -1 : 1;
      convex(c, [sx[i], sx[i] + s * (-dy[i - 1]) * hw[i - 1], sx[i] + s * (-dy[i]) * hw[i]],
                [sy[i], sy[i] + s * dx[i - 1] * hw[i - 1], sy[i] + s * dx[i] * hw[i]], RF_HIGHLIGHTER, rgba, sid);
    }
  }
  function pencilTone(rgb, pressure) { const k = 0.6 + 0.4 * Math.min(1, Math.max(0, pressure)); return rgb.map(v => Math.trunc(255 - (255 - v) * k)); }
  function prepared(L) {                                      // render.py's preparation of a line
    const fam = L.pen.split("_")[0], scaleW = WSCALE[fam] || WSCALE_DEFAULT;
    const widths = L.points.map(p => Math.max(1, p.width * scaleW));
    if (L.pen === "SHADER") return { kind: RF_SHADER, rgba: L.colorRgba || [128, 128, 128, 96], widths };
    if (L.pen.startsWith("HIGHLIGHTER")) return { kind: RF_HIGHLIGHTER, rgba: (L.colorRgba ? L.colorRgba.slice(0, 3) : (HL_ENUM[L.color] || [255, 237, 117])), widths };
    let col = ENUM[L.color] || [0, 0, 0];
    if (PENCIL_FAMILY.includes(fam)) col = pencilTone(col, L.points.reduce((a, p) => a + p.pressure, 0) / L.points.length / 255);
    return { kind: RF_PEN, rgba: col, widths };
  }

  // ================================================================ TYPED TEXT: typed.py's layout, in fixed units
  // Four styles. Title is HEADING, Section BOLD and Body PLAIN, at typed.py's sizes; Header is measured off the tablet's
  // screen (serif, lines about 56 apart) and stored as BASIC until the synced test page says which code it is (D6).
  const STYLE = {
    title:   { name: "Title",   code: 2, face: "serif", size: 64, bold: false, lead: 76, before: 64, after: 22 },
    header:  { name: "Header",  code: 0, face: "serif", size: 47, bold: false, lead: 56, before: 20, after: 25 },
    section: { name: "Section", code: 3, face: "sans",  size: 36, bold: true,  lead: 45, before: 20, after: 25 },
    body:    { name: "Body",    code: 1, face: "sans",  size: 32, bold: false, lead: 45, before: 0,  after: 25 },
  };
  const LIST_CODE = { bullet: 4, bullet2: 5, check: 6, checked: 7, number: 10 };
  let tabletFace = false, useTablet = false;
  const family = face => useTablet ? (face === "serif" ? '"PD Tablet Serif"' : '"PD Tablet Sans"')
                                   : (face === "serif" ? "Gelasio, Georgia, serif" : "Arimo, Arial, sans-serif");
  const fontOf = (style, b, i) => { const st = STYLE[style]; return (i ? "italic " : "") + (b || st.bold ? "700 " : "400 ") + st.size + "px " + family(st.face); };
  const meas = document.createElement("canvas").getContext("2d");
  function width(chars, s, e, style) {                         // the advance of chars[s, e), run by run
    let w = 0, k = s;
    while (k < e) {
      let j = k; const b = chars[k].b, i = chars[k].i;
      while (j < e && chars[j].b === b && chars[j].i === i) j++;
      meas.font = fontOf(style, b, i);
      w += meas.measureText(chars.slice(k, j).map(c => c.c).join("")).width;
      k = j;
    }
    return w;
  }
  function wrap(chars, style, available) {                     // typed.py's wrap, as [start, end) rows over the characters
    const tokens = []; let s = 0;
    for (let k = 1; k <= chars.length; k++)
      if (k === chars.length || /\s/.test(chars[k].c) !== /\s/.test(chars[k - 1].c)) { tokens.push([s, k]); s = k; }
    const rows = []; let ls = 0, le = 0;
    for (const [ts, te] of tokens) {

    const pen = k => {
      const pk = pickers[k], c = choiceOf(pk), ring = c[4] ? " ring" : "";
      const dotBg = c[4] ? (c[0] === "Black" ? "#000" : "#fff") : rgb(c[3]);
      return '<button class="ib" data-tool="' + k + '" aria-pressed="' + (tool === k) + '" aria-label="' + PEN[pk.pen].name + '" title="' + PEN[pk.pen].name + '">' +
        ICON[pk.pen] + '<span class="dot' + ring + '" style="background:' + dotBg + '"></span></button>';
    };
    controls.innerHTML = '<button class="ib" data-tool="grid" aria-label="Pages" title="Pages">' + ICON.grid + "</button>" +
      '<span class="sep"></span>' + pen("a") + pen("b") +
      '<button class="ib" data-tool="text" aria-pressed="' + (tool === "text") + '" aria-label="Text" title="Text">' + ICON.text + "</button>" +
      '<button class="ib" data-tool="eraser" aria-pressed="' + (tool === "eraser") + '" aria-label="Eraser" title="Eraser">' + ICON.eraser + "</button>" +
      '<button class="ib" data-tool="layers" aria-pressed="' + (popFor === "layers") + '" aria-label="Layers" title="Layers">' + ICON.layers + "</button>";
    vp.classList.toggle("typing", tool === "text");
  }
  const cell = (attrs, pressed, inner, label, cls) => '<button class="cell ' + (cls || "") + '" ' + attrs + ' aria-pressed="' + pressed + '" aria-label="' + label + '" title="' + label + '">' + inner + "</button>";
  function paintPop() {
    const lb = controls.querySelector('[data-tool="layers"]');
    if (lb) lb.setAttribute("aria-pressed", popFor === "layers");     // the layers button is pressed while its menu is open
    if (!popFor) { pop.hidden = true; return; }
    pop.classList.toggle("wide", popFor === "layers");
    const btn = controls.querySelector('[data-tool="' + popFor + '"]');
    pop.style.left = Math.max(0, btn.offsetLeft - 2) + "px";
    if (popFor === "layers") {
      // as the tablet lists them: the drawing layers, top first, then Text, then Template, then New layer. The layer in hand
      // is inverted and carries its own up, down and delete.
      const eye = (attr, on, name) => '<button class="lb" ' + attr + ' aria-label="' + (on ? "Hide " : "Show ") + name + '" title="' + (on ? "Hide" : "Show") + '">' + ICON[on ? "eye" : "eyeOff"] + "</button>";
      const last = page.layers.length - 1;
      const rows = page.layers.map((L, i) => ({ L, i })).reverse().map(({ L, i }) => {
        const on = i === activeLayer, small = (op, ic, label, off) => '<button class="lb sm' + (off ? " off" : "") + '" data-lop="' + op + '" aria-label="' + label + '" title="' + label + '">' + ICON[ic] + "</button>";
        return '<div class="lrow' + (on ? " on" : "") + '">' + eye('data-lvis="' + i + '"', L.visible, L.label) +
          '<button class="lname" data-lact="' + i + '">' + L.label + "</button>" +
          (on ? small("up", "up", "Move the layer up", i === last) + small("down", "down", "Move the layer down", i === 0) +
                small("merge", "mergeDown", "Collapse into the layer below", i === 0) + small("del", "trash", "Delete the layer", !last) : "") + "</div>";
      }).join("");
      pop.innerHTML = '<div class="lsec">' + rows +
        '<div class="lrow">' + eye('data-tvis="text"', page.textVisible, "Text") + '<span class="lname">Text</span></div>' +
        '<div class="lrow">' + eye('data-tvis="template"', page.templateVisible, "Template") + '<span class="lname">Template</span>' +
        '<button class="lb" data-tmpl="1" aria-label="Templates" title="Templates">' + ICON.template + "</button></div>" +
        '</div><div class="lsec"><button class="lrow lnew" data-lop="add">' + ICON.plusCircle + "<span>New layer</span></button></div>";
    } else if (popFor === "eraser") {
      pop.innerHTML = '<div class="sec"><h3>Eraser</h3><div class="grid3">' +
        cell('data-erase="stroke"', eraseMode === "stroke", ICON.eraseStroke + "<span>Strokes</span>", "Erase whole strokes") +
        cell('data-erase="area"', eraseMode === "area", ICON.erasePass + "<span>Passing</span>", "Erase what it passes over") + "</div></div>";
    } else if (popFor === "text") {
      // the four styles, each shown in its own face; the one at the cursor is pressed
      const col = page.text.column, here = editing() && page.text.paras[caret.p] ? page.text.paras[caret.p].style : "body";
      const glyph = s => { const st = STYLE[s]; return '<span style="font:' + (st.bold ? "700 " : "400 ") + Math.round(st.size * 0.42) + "px " + family(st.face).replace(/"/g, "'") + ';line-height:26px">' + (s === "body" ? "t" : "T") + "</span>"; };
      pop.innerHTML = '<div class="sec"><h3>' + STYLE[here].name + '</h3><div class="grid3" style="grid-template-columns:repeat(4,1fr)">' +
        ["title", "header", "section", "body"].map(s => cell('data-style="' + s + '"', here === s, glyph(s) + "<span>" + STYLE[s].name + "</span>", STYLE[s].name)).join("") +
        '</div></div><div class="sec"><h3>' + col[0].toUpperCase() + col.slice(1) + ' column</h3><div class="grid3">' +
        ["narrow", "medium", "wide"].map(c => cell('data-col="' + c + '"', col === c, ICON[c], c[0].toUpperCase() + c.slice(1) + " column", "short")).join("") +
        "</div></div>";
    } else {
      const pk = pickers[popFor], pen = PEN[pk.pen];
      pop.innerHTML = '<div class="sec"><h3>' + pen.name + '</h3><div class="grid3">' +
        PENS.map(p => cell('data-pen="' + p.id + '"', pk.pen === p.id, ICON[p.id], p.name, "short")).join("") + "</div></div>" +
        (pen.sizes === false ? "" : '<div class="sec"><h3>' + SIZES[pk.size] + '</h3><div class="grid3">' +
          [0, 1, 2].map(i => cell('data-size="' + i + '"', pk.size === i, sizeIcon(i), SIZES[i], "short")).join("") + "</div></div>") +
        '<div class="sec"><div class="grid3">' +
        colorsOf(pk.pen).map((c, i) => cell('data-pick="' + i + '"', choiceOf(pk) === c, swatch(c) + "<span>" + c[0] + "</span>", c[0])).join("") + "</div></div>";
    }
    pop.hidden = false;
  }
  controls.addEventListener("click", e => {
    const b = e.target.closest("[data-tool]"); if (!b) return;
    const t = b.dataset.tool;
    if (t === "grid") return;
    if (t === "layers") { popFor = popFor === "layers" ? null : "layers"; paintControls(); paintPop(); return; }   // a menu, not a tool
    if (tool === t) popFor = popFor === t ? null : t; else { tool = t; popFor = null; }   // the tablet's way: the tool in hand again
    paintControls(); paintPop(); paint();
  });
  pop.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.erase) eraseMode = b.dataset.erase;
    if (b.dataset.lact !== undefined) { activeLayer = Number(b.dataset.lact); paintPop(); return; }
    if (b.dataset.tvis) { const k = b.dataset.tvis === "text" ? "textVisible" : "templateVisible"; layerEdit(() => { page[k] = !page[k]; }); return; }
    if (b.dataset.tmpl) return;                              // the template picker: next
    if (b.dataset.lvis !== undefined) { const i = Number(b.dataset.lvis); layerEdit(() => { page.layers[i].visible = !page.layers[i].visible; }); return; }
    if (b.dataset.lop && !b.classList.contains("off")) {
      const op = b.dataset.lop, i = activeLayer, Ls = page.layers;
      layerEdit(() => {
        if (op === "add") addLayer();
        else if (op === "del") { Ls.splice(i, 1); activeLayer = Math.max(0, i - 1); }
        else if (op === "merge") {                            // collapse down, as the tablet does: the strokes made anew on the
          const below = Ls[i - 1];                            // layer below, over its own, and this layer gone
          for (const L of Ls[i].lines) below.lines.push(Object.assign({}, L, { itemId: [2, page.nextId++], points: L.points.map(p => ({ ...p })) }));
          Ls.splice(i, 1); activeLayer = i - 1;
        }
        else { const j = op === "up" ? i + 1 : i - 1; [Ls[i], Ls[j]] = [Ls[j], Ls[i]]; activeLayer = j; }
      });
      return;
    }
    if (b.dataset.style) {                                    // the style for the cursors' paragraphs (with none, the end of the text)
      const style = b.dataset.style;
      if (!editing()) startTyping();
      edit(() => {
        if (!page.text.paras.length) page.text.paras.push({ style: "body", list: null, chars: [] });
        parasOfCursors().forEach(p => { const P = page.text.paras[p]; if (P) { P.style = style; if (style !== "body") P.list = null; } });
      });
    }
    if (b.dataset.col) {
      const c = b.dataset.col;
      edit(() => { page.text.column = c; page.text.x = COLUMNS[c][0]; page.text.width = COLUMNS[c][1]; });
    }
    const pk = pickers[popFor];
    if (pk && b.dataset.pen) { pk.pen = b.dataset.pen; if (pk.pick >= colorsOf(pk.pen).length) pk.pick = 0; }
    if (pk && b.dataset.size) pk.size = Number(b.dataset.size);
    if (pk && b.dataset.pick) pk.pick = Number(b.dataset.pick);
    paintControls(); paintPop();
  });
  document.addEventListener("pointerdown", e => {
    if (popFor && !e.target.closest("#pop") && !e.target.closest("#controls")) { popFor = null; paintPop(); }
  });

  // ================================================================ zoom, keys, frames and faces
  let zoomTimer = 0;
  function showZoom() {
    zoomBtn.textContent = (Math.round(view.zoom * 10) / 10).toFixed(1) + "×";
    zoomBtn.classList.add("on"); clearTimeout(zoomTimer);
    zoomTimer = setTimeout(() => zoomBtn.classList.remove("on"), 2500);
  }
  function clampView() {
    if (view.zoom <= 1) { view.cx = 0; view.top = 0; return; }
    const w = SCREEN_W / view.zoom / 2, edge = Math.max(half(), SCREEN_W / 2);
    view.cx = Math.max(-edge + w, Math.min(edge - w, view.cx));
    view.top = Math.max(0, view.top);
  }
  window.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    const [sx, sy] = over ? [e.clientX - r.left, e.clientY - r.top] : [vpW / 2, 0];
    const [px, py] = toPage(sx, sy);
    view.zoom = Math.max(0.5, Math.min(5, view.zoom * Math.exp(-e.deltaY * 0.0015)));
    view.cx = px - (sx - vpW / 2) / scale(); view.top = py - sy / scale();
    clampView(); showZoom(); rebuildSoon();
  }, { passive: false });
  zoomBtn.addEventListener("click", () => { view.zoom = 1; view.cx = 0; view.top = 0; showZoom(); rebuild(); });
  window.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("select")) return;
    if (e.key === "Escape" && popFor) { popFor = null; paintPop(); return; }
    const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (ctrl && k === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (ctrl && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); redo(); return; }
    if (!editing() && !ctrl && !e.altKey && (e.key.length === 1 || e.key === "Enter")) startTyping();
    if (editing() && textKey(e)) e.preventDefault();
  });
  // the page's frame is the page's own; the face is the tablet's when present, else the substitute, and the note says so
  const note = document.getElementById("note");
  function paintNote() {
    note.textContent = tabletFace ? "" : "The tablet's faces aren't installed beside this page: typed text is in the substitute faces, Arimo and Gelasio.";
  }
  function findFaces() {
    const want = ['32px "PD Tablet Sans"', 'bold 32px "PD Tablet Sans"', '64px "PD Tablet Serif"', '32px Arimo', '64px Gelasio'];
    Promise.all(want.map(f => document.fonts.load(f).catch(() => []))).then(() => {
      tabletFace = document.fonts.check('32px "PD Tablet Sans"') && [...document.fonts].some(f => f.family.includes("PD Tablet") && f.status === "loaded");
      useTablet = tabletFace;
      paintNote(); rebuild();
    });
  }

  window.addEventListener("resize", layout);
  paintControls(); layout(); findFaces();
  window.editorPage = page;                                  // the page's data, for a look from outside
  window.editorStyles = STYLE; window.editorListCodes = LIST_CODE;
  window.editorSetFrame = (w, h) => { page.paperSize = [w, h]; clampView(); rebuild(); };   // for trying other frames from outside
})();
</script>
</body>
</html>
